name: HP_V9 zero-API readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "HP_V9/**"
      - ".github/workflows/hp-v9-zero-api.yml"
  push:
    branches:
      - "codex/hp-v9-*"
    paths:
      - "HP_V9/**"
      - ".github/workflows/hp-v9-zero-api.yml"

permissions:
  contents: read

concurrency:
  group: hp-v9-zero-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-api-regression:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: "${{ github.workspace }}/HP_V9/src"

    steps:
      - name: Check out full history for the frozen V9 identity check
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: HP_V9/requirements.txt

      - name: Install zero-API test dependencies
        run: python -m pip install --prefer-binary -r HP_V9/requirements.txt

      - name: Fast tier
        working-directory: HP_V9
        run: python -B ./src/run_regression_tier.py --tier fast

      - name: Component tier
        working-directory: HP_V9
        run: python -B ./src/run_regression_tier.py --tier component

      - name: Recovery tier
        working-directory: HP_V9
        run: python -B ./src/run_regression_tier.py --tier recovery

      - name: Thirty-worker control-plane stress
        working-directory: HP_V9
        run: python -B ./src/test_infrastructure_stress.py

      - name: Scientific-core identity and quick-summary tests
        working-directory: HP_V9
        run: |
          python -B ./src/test_v9_core_identity.py
          python -B -m unittest -v test_quick_experiment_summary

      - name: Simplified sample-local runtime acceptance
        working-directory: HP_V9
        run: |
          python -B ./src/test_simple_runtime.py
          python -W error::ResourceWarning -B ./src/test_simple_runtime_process.py

      - name: Compile tracked HP_V9 Python
        run: |
          mapfile -t py_files < <(git ls-files 'HP_V9/**/*.py')
          python -B -m py_compile "${py_files[@]}"

      - name: Reject whitespace errors
        run: git diff --check
